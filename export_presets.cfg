; Desktop presets. Unlike Web these do NOT exclude addons/webrtc: the web export
; has WebRTC built in, while desktop needs the GDExtension for online play. The
; extension ships a macOS universal framework and a Windows x86_64 dll, so both
; builds get room codes as well as LAN direct connect.
[preset.1]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/desktop/AbyssalSalvage-macos.zip"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

