; Dedicated server. dedicated_server=true sets the "dedicated_server" feature tag
; that Net.is_dedicated() reads, and lets Godot strip client-only resources. Linux
; only: this runs in a container, never on a player's machine.
[preset.3]

name="Server"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="addons/webrtc/*"
export_path="build/server/abyssal-server"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.3.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true
; At least one texture format must be selected or the Linux exporter refuses to
; export at all — "A texture format must be selected to export the project" — even
; for a dedicated server that renders nothing. s3tc_bptc is the desktop one.
;
; It costs nothing here: every texture imports with compress/mode=0 (lossless), so
; no VRAM-compressed variants are generated for either format to apply to.
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
