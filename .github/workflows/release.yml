name: Release

# Every merge to main is a release: desktop binaries, a self-contained web bundle,
# and a versioned signalling image, all from the same commit.
#
# The version is DERIVED, not committed. MAJOR.MINOR comes from ./VERSION and the
# patch is the commit count on main, so 0.1.42 is the 42nd commit of the 0.1 line.
# Nothing is bumped by hand and nothing is pushed back to main — a release commit
# that itself needs a version-bump commit is a loop, and pushing to a protected
# branch from CI to close it is worse. Tags are created by the release itself,
# which is a tag write rather than a branch write.
#
# Bump MINOR by editing ./VERSION in a normal PR.
on:
  push:
    branches:
      - main
  # Dry run: builds and verifies everything, publishes nothing.
  workflow_dispatch:

concurrency:
  # Queue rather than cancel: every merge should produce its release, in order.
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  GODOT_VERSION: "4.6.3"
  IMAGE: ghcr.io/${{ github.repository }}/signaling
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the patch number is the commit count, and a shallow
          # clone would silently make every release 0.1.1.
          fetch-depth: 0

      - name: Derive version
        id: v
        run: |
          set -euo pipefail
          base=$(tr -d ' \n\r' < VERSION)
          case "$base" in
            [0-9]*.[0-9]*) : ;;
            *) echo "::error::VERSION must be MAJOR.MINOR, got '$base'"; exit 1 ;;
          esac
          count=$(git rev-list --count HEAD)
          version="${base}.${count}"

          publish=true
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            # A rerun of an already-released commit must not try to recreate its tag.
            echo "::notice::v${version} already exists; building without publishing"
            publish=false
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::manual run; building without publishing"
            publish=false
          fi

          {
            echo "version=$version"
            echo "tag=v$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "version $version  publish=$publish"

  desktop:
    name: Desktop
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}

  web:
    name: Web bundle
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same setup as build.yml. Duplicated rather than shared because build.yml
      # owns the Pages deployment and gates merges; a release must not be able to
      # break the merge gate.
      - name: Download Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          unzip -q templates.tpz
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          mv templates/* "$template_dir/"

      - name: Stamp version
        run: scripts/stamp_version.sh "${{ needs.version.outputs.version }}"

      - name: Export web
        run: |
          set -euo pipefail
          mkdir -p build/web
          ./godot --headless --path . --import 2>&1 | tee -a web.log
          ./godot --headless --path . --export-release "Web" "build/web/index.html" 2>&1 | tee -a web.log
          test -f build/web/index.html

      - name: Verify no GDScript parse / autoload / shader errors
        run: |
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Failed to create an autoload|does not inherit from|SHADER ERROR|Shader compilation failed" web.log; then
            echo "::error::errors detected during the web export (see matches above)."
            exit 1
          fi
          echo "clean"

      # Self-contained, so a release can be served from any static host without
      # rebuilding — which is what makes moving the frontend out later cheap.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd build/web && zip -qr "../../dist/AbyssalSalvage-web-${{ needs.version.outputs.version }}.zip" .)
          ls -lh dist/

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/*
          if-no-files-found: error

  image:
    name: Signalling image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version
        run: scripts/stamp_version.sh "${{ needs.version.outputs.version }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Version tags exist so a deployment can pin something other than :latest.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: signaling
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The dedicated game server: an exported headless Godot binary in a container.
  # Blocked until now because release.yml only reached main with #60, after the
  # server itself landed in #62.
  server:
    name: Game server image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          unzip -q templates.tpz
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          mv templates/* "$template_dir/"

      - name: Stamp version
        run: scripts/stamp_version.sh "${{ needs.version.outputs.version }}"

      - name: Export dedicated server
        run: |
          set -euo pipefail
          mkdir -p build/server
          ./godot --headless --path . --import 2>&1 | tee -a server.log
          ./godot --headless --path . --export-release "Server" \
            "build/server/abyssal-server" 2>&1 | tee -a server.log
          test -s build/server/abyssal-server
          # An export exits 0 through a failed script compile, so success alone
          # does not mean this binary can serve a game.
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|SHADER ERROR" server.log; then
            echo "::error::errors detected during the server export"; exit 1
          fi
          ls -lh build/server/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: needs.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: the exported binary is x86_64, so a multi-arch manifest would
      # advertise an arm64 image that cannot run.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: ${{ needs.version.outputs.publish == 'true' }}
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish release
    needs: [version, desktop, web, image, server]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download desktop builds
        uses: actions/download-artifact@v4
        with:
          name: desktop-builds
          path: dist

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist

      # gh is preinstalled, so publishing binaries pulls in no third-party action.
      # `gh release create` creates the tag at --target, so there is no separate
      # git push and nothing writes to a protected branch.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          ls -lh dist/
          notes=$(cat <<NOTES
          Built from \`${GITHUB_SHA}\`.

          ## Desktop

          Both builds are **unsigned**, so the OS warns on first launch:

          - **macOS** — unzip, then right-click the app and choose *Open* (or
            \`xattr -dr com.apple.quarantine AbyssalSalvage.app\`). Double-clicking
            it normally will be refused.
          - **Windows** — unzip, then SmartScreen warns; *More info* then *Run
            anyway*. Keep the \`.dll\` beside the \`.exe\`: a GDExtension cannot live
            inside the pck, so online play needs both files together.

          ## Playing together

          **Direct connect needs no server at all.** One player picks HOST LAN, the
          others JOIN LAN with that machine's address. Over the internet the host
          forwards UDP 7777 and shares their public address — only the **host**
          needs to be reachable, so a player behind mobile data or CGNAT can still
          join.

          **Online room codes** go through the signalling hub and are peer-to-peer.
          Two peers that cannot reach each other directly (both behind one NAT, or
          either on CGNAT) need a TURN relay on the hub — see
          \`signaling/README.md\`.

          ## Web

          \`AbyssalSalvage-web-${VERSION}.zip\` is a self-contained static bundle,
          the same build deployed to GitHub Pages. Serve it from any static host.

          ## Dedicated game server

          \`\`\`
          ${SERVER_IMAGE}:${VERSION}
          \`\`\`

          Everyone dials one address, so there is no NAT traversal and no relay:
          clients connect outbound, which works from behind CGNAT and mobile NAT.
          Speaks plain \`ws\` and expects TLS to terminate in front of it.

          ## Signalling hub

          \`\`\`
          ${IMAGE}:${VERSION}
          \`\`\`

          Pin this rather than \`:latest\` so a client and hub of known-compatible
          versions stay together.
          NOTES
          )
          gh release create "$TAG" dist/* \
            --target "${GITHUB_SHA}" \
            --title "$TAG" \
            --notes "$notes" \
            --prerelease
