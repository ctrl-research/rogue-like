name: Signaling Image

# Validation only. Publishing moved to release.yml, which builds and pushes a
# versioned image on every merge to main — having both would mean two docker builds
# per merge, and two things racing to move :latest.
on:
  pull_request:
    paths:
      - "signaling/**"
      - ".github/workflows/signaling-image.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/signaling

jobs:
  build-push:
    name: Build (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: signaling
          platforms: linux/amd64,linux/arm64
          # Never pushes: this exists to prove the Dockerfile still builds.
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
