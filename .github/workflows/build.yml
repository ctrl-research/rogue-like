name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Serialise runs per ref. GitHub Pages only allows one deployment at a time,
# so overlapping main runs race each other and the superseded deployment
# fails. On main, queue runs so every merge still publishes, in order.
# Superseded PR runs are simply cancelled (only the newest commit matters).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.6.3"

jobs:
  build:
    name: Export Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

          # Templates extract into a "templates/" directory and must live under
          # the version-specific export_templates path Godot looks them up in.
          unzip -q templates.tpz
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          mv templates/* "$template_dir/"

      # Desktop WebRTC extension (best-effort): needed by the e2e test below;
      # the web export has WebRTC built in and never needs it.
      - name: Fetch WebRTC extension
        run: bash scripts/fetch_webrtc.sh

      # Tee Godot output to build.log so the verify step below can fail the run
      # on parse/autoload errors — a Godot export exits 0 even when scripts fail
      # to compile, so success alone does not mean the project is healthy.
      - name: Import project
        run: ./godot --headless --path . --import 2>&1 | tee -a build.log

      # Cheap and independent of Godot: the sprite palette and the recolour
      # keys live in two files, and drift between them fails silently (the
      # shader matches nothing and every diver renders stock brass).
      - name: Sprite palette drift check
        run: python3 tests/palette_check.py

      - name: Station meta-progression unit test
        run: |
          set -euo pipefail
          ./godot --headless --path . tests/station_test.tscn 2>&1 | tee -a build.log
          grep -q "STATION_TEST_OK" build.log

      # Self-playing solo run (random movement, auto-picked upgrades) so CI
      # exercises real gameplay paths, not just script compilation. Headless
      # frames outpace real time (~140fps on CI runners, so ~7s of game per
      # 1000 frames); 24000 frames ≈ 170s covers the five-depth descent to
      # the boss lair with the sim's per-site assists.
      # The sim asserts a floor on what the run reaches (depth, upgrade cards,
      # evolutions, bells, quest variety, digging, extraction, banking) and
      # prints SIM_OK only if every one is met, so losing coverage fails the
      # build instead of quietly passing.
      # Checked against build.log AFTER the run, not piped into `grep -q`:
      # grep -q exits on its first match and SIGPIPEs tee, which truncates
      # everything the sim printed afterwards — including anything the
      # parse-error check below needs to see. The sim also exits non-zero on
      # SIM_FAIL, so pipefail catches that independently.
      - name: Headless gameplay smoke test
        run: |
          set -euo pipefail
          ./godot --headless --path . --quit-after 24000 tests/headless_sim.tscn 2>&1 | tee -a build.log
          grep -q "SIM_OK" build.log

      # The dedicated server, which is what online play is moving to. Three
      # headless processes over loopback WebSocket: a server with no diver plus two
      # divers. Needs no broker, no extension and no network, so unlike the WebRTC
      # test below it cannot be skipped.
      - name: Dedicated server end-to-end test
        run: |
          set -euo pipefail
          GODOT=./godot bash scripts/e2e_dedicated.sh 2>&1 | tee -a build.log
          grep -q "E2E_DEDICATED_PASSED" build.log

      # Real two-instance WebRTC test through the actual signaling broker.
      # Skips (with a warning) only if the extension download was unavailable.
      - name: WebRTC end-to-end test
        run: |
          set -euo pipefail
          if [ ! -d addons/webrtc ]; then
            echo "::warning::webrtc-native unavailable; skipping WebRTC e2e test"
            exit 0
          fi
          GODOT=./godot bash scripts/e2e_webrtc.sh

      # Export the dedicated server on every PR, purely to validate the preset.
      #
      # This failure reached main because nothing before a merge ever exercised it:
      # release.yml owns the Server export and only runs on main, and desktop.yml is
      # release-only too. So "A texture format must be selected" surfaced as a failed
      # release rather than a failed check. The binary is thrown away — this is here
      # to make preset breakage a PR problem.
      - name: Validate the dedicated server export
        run: |
          set -euo pipefail
          mkdir -p /tmp/server-check
          ./godot --headless --path . --export-release "Server" \
            /tmp/server-check/abyssal-server 2>&1 | tee -a build.log
          test -s /tmp/server-check/abyssal-server
          ls -lh /tmp/server-check/

      # Build the image too, without pushing.
      #
      # The previous fix validated the EXPORT and stopped there, so the Dockerfile
      # stayed unexercised on PRs — and the next release failed on it instead, with
      # `COPY abyssal-server` unable to find a binary that the release job had put in
      # a different directory. Exporting a binary nobody containerises proves half
      # the job. Context is the export directory because the Dockerfile copies from
      # the context root.
      - name: Validate the server image build
        run: |
          set -euo pipefail
          docker build -t abyssal-server:ci -f server/Dockerfile /tmp/server-check
          # Prove the binary actually landed where the container will look for it.
          docker run --rm --entrypoint /bin/sh abyssal-server:ci \
            -c 'test -x /app/abyssal-server && echo "binary present and executable"'

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          ./godot --headless --path . --export-release "Web" "build/web/index.html" 2>&1 | tee -a build.log
          test -f "build/web/index.html"

      - name: Verify no GDScript parse / autoload / shader errors
        run: |
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script|Failed to create an autoload|does not inherit from|Can't change this state|SHADER ERROR|Shader compilation failed" build.log; then
            echo "::error::GDScript parse, autoload or shader errors detected during export (see matches above)."
            exit 1
          fi
          echo "No GDScript parse/autoload errors detected."

      - name: Upload Pages artifact (web build)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy Web to GitHub Pages
    needs: build
    # Only publish to production Pages from main; PRs build+export for
    # validation without deploying.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
